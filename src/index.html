<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>小喝 · Shoho</title><link rel="stylesheet" href="styles.css"><script type="module" src="renderer.ts"></script></head>
<body>
  <div class="drag-bar" data-tauri-drag-region></div>
  <div class="app-shell">
    <header class="app-header"><button class="brand" id="home-button" aria-label="回到今日"><img src="/icon.png" alt=""><span>小喝</span></button><time id="date-label"></time></header>
    <nav class="tabs" aria-label="主导航"><button data-page="today" aria-current="page">今日</button><button data-page="history">记录</button><button data-page="settings">设置</button></nav>
    <main>
      <section class="page" id="page-today">
        <section class="intake-card" aria-label="今日饮水进度"><div class="section-heading"><span>今日饮水</span><button class="text-button" id="edit-goal">目标 <span id="goal-number">1,800 ml</span> ↗</button></div><div class="amount"><strong id="today-total">0</strong><span>ml</span><span id="goal-percent">0%</span></div><progress id="goal-progress" value="0" max="1800" aria-label="今日饮水进度"></progress><p id="remaining-copy"></p></section>
        <div class="quick-presets" id="quick-presets" aria-label="记录饮水快捷项"></div>
        <button class="custom-button" id="custom-button">＋ 自定义记录</button>
        <section class="next-reminder"><div><span id="reminder-status">下次提醒</span><strong id="countdown">45:00</strong></div><button class="soft-button" id="pause-button">暂停</button></section>
        <section class="recent-section"><div class="section-heading"><h2>最近记录 <span id="record-count" class="badge">0</span></h2><button class="text-button" id="show-history">全部记录 ↗</button></div><div class="records-list" id="today-records"></div></section>
      </section>
      <section class="page" id="page-history" hidden>
        <section class="chart-card"><div class="section-heading"><h2>最近 7 天</h2><span id="week-total" class="muted">0 ml</span></div><div class="chart" id="week-chart" aria-label="点击某一天查看记录"></div></section>
        <div class="section-heading history-heading"><h2 id="history-filter">全部记录</h2><button id="clear-filter" class="text-button" hidden>清除筛选</button></div><div class="records-list" id="history-records"></div><button class="custom-button" id="more-history" hidden>加载更多</button>
      </section>
      <section class="page" id="page-settings" hidden>
        <form id="settings-form">
          <section class="settings-card"><div class="section-heading"><h2>水量快捷项</h2><button type="button" class="text-button" id="add-preset">＋ 添加</button></div><div class="preset-column-labels"><span>默认</span><span>名称</span><span>水量 / ml</span><span></span></div><div id="preset-editor"></div></section>
          <section class="settings-card"><div class="form-grid"><label>每日目标<div class="input-unit"><input name="goal" type="number" min="200" max="6000" required><span>ml</span></div></label><label>提醒间隔<div class="input-unit"><input name="interval" type="number" min="5" max="180" required><span>分钟</span></div></label><label>开始时间<input name="start" type="time" required></label><label>结束时间<input name="end" type="time" required></label></div></section>
          <section class="settings-card toggles"><label class="setting-row"><span>定时提醒</span><input name="enabled" type="checkbox" role="switch"></label><div class="setting-row"><span>系统通知</span><div class="notification-tools"><button type="button" class="text-button" id="notification-settings">系统设置 ↗</button><input name="systemNotifications" type="checkbox" role="switch" aria-label="系统通知"></div></div><p id="notification-hint" class="notification-hint" role="status" hidden></p><label class="setting-row"><span>开机启动 <small id="login-caption"></small></span><input name="launchAtLogin" type="checkbox" role="switch"></label></section>
          <div class="settings-actions"><button type="submit" class="primary-button">保存设置</button><button type="button" class="soft-button" id="test-reminder">测试提醒</button></div><p class="form-status" id="settings-message" role="status"></p>
        </form>
      </section>
    </main>
  </div>
  <dialog id="custom-dialog"><form id="custom-form"><h2>记录饮水</h2><label>名称<input id="custom-name" type="text" maxlength="12" placeholder="例如：一瓶"></label><label>水量<div class="input-unit"><input id="custom-amount" type="number" min="10" max="1000" value="200" required><span>ml</span></div></label><div class="dialog-actions"><button type="button" class="soft-button" id="close-dialog">取消</button><button type="submit" class="primary-button">记录</button></div></form></dialog>
  <div id="toast" role="status" aria-live="polite" hidden></div>
</body></html>
